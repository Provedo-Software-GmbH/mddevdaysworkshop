name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version component to bump (none = patch auto-increment)'
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: 'none'

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: siaconsulting.azurecr.io
  BACKEND_IMAGE: devconf-ticketing-api
  FRONTEND_IMAGE: devconf-ticketing-frontend

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version from latest tag
        id: version
        run: |
          # Get the latest semver tag (e.g. v1.2.3), default to v0.0.0 if none
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          # Strip the 'v' prefix and split into major.minor.patch
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Determine which component to bump ('none' or empty defaults to patch)
          BUMP="${{ github.event.inputs.version_bump || 'patch' }}"
          if [ "$BUMP" = "none" ]; then
            BUMP="patch"
          fi
          echo "Bump type: $BUMP"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    needs: [version]
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release /p:Version=${{ needs.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    needs: [version]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version in package.json
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          VITE_APP_VERSION: ${{ needs.version.outputs.version }}

  push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [version, backend, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name siaconsulting

      - name: Build & Push Backend Image
        run: |
          docker build --build-arg VERSION=${{ needs.version.outputs.version }} \
                        -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ needs.version.outputs.version }} \
                        -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:latest \
                        -f src/DevConfTicketing.Api/Dockerfile src/
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ needs.version.outputs.version }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build & Push Frontend Image
        run: |
          docker build --build-arg VITE_API_URL=https://tickets.v2.api.devconf.nrw/api/v1 \
                        --build-arg VITE_AZURE_AD_CLIENT_ID=${{ secrets.ENTRA_ID_CLIENT_ID }} \
                        --build-arg VITE_AZURE_AD_TENANT_ID=${{ secrets.AZURE_TENANT_ID }} \
                        --build-arg VITE_AZURE_AD_API_SCOPE=api://devconf-ticketing/access_as_admin \
                        --build-arg VITE_APP_VERSION=${{ needs.version.outputs.version }} \
                        -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ needs.version.outputs.version }} \
                        -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest \
                        -f frontend/Dockerfile frontend/
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ needs.version.outputs.version }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest

  tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: [version, push-images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v6

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: [version, push-images, tag]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Backend Container App
        run: |
          az containerapp update \
            --name devconf-ticketing-api \
            --resource-group nrwdevconf \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ needs.version.outputs.version }}

      - name: Update Frontend Container App
        run: |
          az containerapp update \
            --name devconf-ticketing-frontend \
            --resource-group nrwdevconf \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ needs.version.outputs.version }}
