# Copilot Cloud Agent Setup Steps
# This file configures the environment for GitHub Copilot coding agent

setup:
  - name: Install .NET 11 SDK
    run: |
      curl -Lo dotnet.tar.gz https://aka.ms/dotnet/11.0/preview/dotnet-sdk-linux-x64.tar.gz
      mkdir -p $HOME/dotnet
      tar -C $HOME/dotnet -xf dotnet.tar.gz
      rm dotnet.tar.gz
      echo "DOTNET_ROOT=$HOME/dotnet" >> $GITHUB_ENV
      echo "$HOME/dotnet" >> $GITHUB_PATH

  - name: Install Bun
    run: |
      curl -fsSL https://bun.sh/install | bash
      echo "$HOME/.bun/bin" >> $GITHUB_PATH

  - name: Restore .NET dependencies
    run: |
      cd src
      dotnet restore

  - name: Install frontend dependencies
    run: |
      cd frontend
      bun install --frozen-lockfile
